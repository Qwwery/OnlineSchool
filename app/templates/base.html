<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Блок title теперь более гибкий -->
    <title>{% block title %}Онлайн школа{% endblock %}</title>

    <!-- Исправлено: у link нет атрибута defer -->
    <link rel="stylesheet" href="/static/css/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <!-- Логотип как ссылка на главную -->
        <a href="/" class="header__logo">🎓 Онлайн школа</a>

        <nav class="header__nav">
          <a href="/">Главная</a>

          <!-- Курсы -->
          <a href="/course/">Все курсы</a>

          {% if user %}
          <a href="/profile">{{ user.name }}</a>
          <span class="header__balance"
            >{{ "%.2f"|format(user.balance or 0) }} ₽</span
          >

          {% if user.is_admin or user.is_teacher %}
          <a href="/course/new" class="btn-add-course">+ Добавить курс</a>
          {% endif %}

          <form action="/api/auth/logout" method="post" style="display: inline">
            <button type="submit" class="btn-logout">Выход</button>
          </form>
          {% else %}
          <a href="/login">Вход</a>
          <a href="/register">Регистрация</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="content">
      <div class="container">{% block content %}{% endblock %}</div>
    </main>

    <!-- Скрипты в конце body с defer -->
    <script src="/static/js/main.js" defer></script>
  </body>
</html>
