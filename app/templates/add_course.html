{% extends "base.html" %} {% block title %}Создание курса{% endblock %} {% block
content %}
<h2>Создайте новый курс</h2>
<form data-api-url="/course/add" method="post" action="/">
  <label for="title">Название:</label>
  <input type="text" id="title" name="title" required /><br /><br />

  <label for="description">Описание:</label>
  <textarea id="description" name="description" required></textarea><br /><br />

  <label for="price">Цена:</label>
  <input type="number" id="price" name="price" step="1" required /><br /><br />

  <label for="image_path">Путь к изображению (опционально):</label>
  <input type="text" id="image_path" name="image_path" /><br /><br />

  <button type="submit">Создать курс</button>
</form>
{% endblock %}
